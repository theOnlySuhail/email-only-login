<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Verify email</title></head>
  <body>
    <main>
      <h1>OTP Verification</h1>
      <form method="post" action="/verify-otp">
        <p>Enter the six-digit code sent to: {{email}}</p>
        <label for="otp">OTP </label>
        <input id="otp" name="otp" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required>
        <button type="submit">Verify</button>
      </form>
      <p><a href="/login">Use a different email</a></p>
    </main>
  </body>
</html>
